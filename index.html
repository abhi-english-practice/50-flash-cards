<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>50 Collocation Flashcards – Styled</title>
<style>
:root {
  --bg:#f5efe1;
  --navy:#163f69;
  --navy-soft:#627b93;
  --cream:#fdfaf4;
  --yellow:#f8edbb;
  --yellow-line:#f0c654;
  --pink:#ef6768;
  --pink-bg:#fff1ef;
  --pink-text:#a43d3f;
  --blue:#3d86f5;
  --blue-bg:#d9e9ff;
  --blue-text:#1d57af;
  --green-bg:#e1f0e4;
  --purple:#8f84de;
  --lavender:#eee7fb;
  --shadow:0 10px 0 rgba(22,63,105,.06);
}
*{box-sizing:border-box}
img,button,input,select{max-width:100%}
body{overflow-x:hidden}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--navy);
}
.wrapper{
  max-width:920px;
  margin:0 auto;
  padding:16px 10px 36px;
}
.header{text-align:center;margin-bottom:14px}
.header .mini{
  font-size:14px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);
}
.header h1{margin:8px 0 6px;font-size:clamp(24px,5vw,38px);line-height:1.15}
.header p{margin:0;color:var(--navy-soft);font-size:15px}
.panel-box,.card-shell{
  border:4px solid var(--navy);
  border-radius:28px;
  box-shadow:var(--shadow);
  background:rgba(255,255,255,.45);
}
.toolbar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:8px;
  margin-bottom:8px;
}
.input,.select,.btn{font:inherit;min-height:42px;border-radius:14px}
.input,.select{
  width:100%;border:3px solid var(--navy);background:#fff;padding:8px 10px;color:var(--navy);
}
.btn{
  border:3px solid var(--navy);background:#fff;color:var(--navy);padding:8px 12px;font-weight:800;cursor:pointer;
}
.btn-pink{background:var(--pink-bg);border-color:var(--pink);color:var(--pink-text)}
.btn-blue{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-text)}
.btn-lav{background:var(--lavender)}
.random-wrap{padding:3px;background:var(--lavender);text-align:center;margin-bottom:10px}
.random-main{width:100%;border:none;background:transparent;color:var(--navy);font-size:24px;font-weight:800;padding:5px;cursor:pointer}
.card-shell{border-radius:34px;overflow:hidden;background:rgba(255,255,255,.38)}
.card-inner{padding:14px 14px 16px}
.topbar{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.right-col{display:flex;flex-direction:column;gap:16px}
.pill{
  display:inline-flex;align-items:center;padding:10px 18px;border:3px solid var(--navy);border-radius:999px;background:#fff4c7;font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.03em
}
.top-info{margin-top:10px;color:var(--navy-soft);font-size:15px;font-weight:800;line-height:1.3}
.divider{border-top:4px dashed var(--navy);margin:18px -18px 20px}
.label{font-size:18px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px}
.word{
  font-family: Georgia, "Times New Roman", serif;
  font-size:clamp(42px,8vw,72px);
  font-weight:700;
  line-height:1;
  margin:0 0 8px;
  overflow-wrap:anywhere;
  word-break:break-word;
}
.ipa{color:var(--purple);font-size:clamp(22px,4vw,34px);font-weight:800;margin-bottom:12px}
.definition{
  font-size:clamp(17px,3vw,25px);
  line-height:1.45;
  color:#3b5876;
  margin-bottom:14px;
  min-height:auto;
  overflow-wrap:anywhere;
}
.recall{
  background:var(--yellow);border:4px dashed var(--navy);border-radius:28px;padding:18px 20px;margin-bottom:18px
}
.recall .title,.section-red{color:var(--pink);font-size:18px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin:0 0 12px}
.recall ul{margin:0;padding-left:30px}
.recall li{font-size:clamp(18px,3vw,22px);font-weight:800;margin:14px 0}
.note{color:var(--navy-soft);font-size:15px;margin-top:8px}
.action-row{display:flex;flex-wrap:wrap;gap:14px}
.bottom-nav{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--navy-soft);font-weight:800}
.nav-buttons{display:flex;gap:14px;flex-wrap:wrap}
.mode-tabs{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.mode-btn{flex:1 1 180px}
.coll-panel{
  border:4px solid var(--navy);border-radius:30px;background:rgba(255,255,255,.78);padding:18px 16px;min-height:630px;display:flex;flex-direction:column;justify-content:flex-start
}
.coll-tag{
  display:inline-flex;border:3px solid var(--navy);border-radius:999px;padding:10px 18px;background:#eef8ea;font-weight:800;margin:14px 0 16px;width:max-content;max-width:100%
}
.phrase{
  font-family:Georgia, "Times New Roman", serif;
  font-size:clamp(26px,5vw,42px);
  line-height:1.12;
  margin-bottom:8px;
  overflow-wrap:anywhere;
  word-break:break-word;
}
.back-ipa{color:var(--purple);font-size:clamp(22px,4vw,30px);font-weight:800;margin-bottom:8px}
.meaning-line{font-size:clamp(18px,3vw,22px);color:#445f78;display:inline-block;border-bottom:6px solid var(--yellow-line);padding-bottom:6px;margin-bottom:18px}
.example{
  font-size:clamp(18px,3vw,26px);line-height:1.6;color:#203d59;margin-bottom:18px;min-height:120px
}
.example mark{background:#d8efc7;padding:0 .18em}
.vn-box{
  background:var(--green-bg);border:3px solid var(--navy);border-radius:22px;padding:18px;margin-bottom:18px;min-height:160px
}
.vn-box .label-small{text-transform:uppercase;letter-spacing:.18em;font-weight:900;margin-bottom:10px}
.vn-box .vn-text{font-size:clamp(18px,3vw,22px);line-height:1.55;color:#2f4a66;font-style:italic}
.back-bottom{margin-top:auto}
.hidden-vn .definition-vn,.hidden-vn .meaning-line,.hidden-vn .vn-box{display:none!important}
.hidden-vn .definition::after{content:'(Vietnamese hidden)';display:block;margin-top:6px;font-size:15px;color:var(--navy-soft);font-style:italic}
@media (max-width:780px){
  .toolbar{grid-template-columns:1fr 1fr;padding:6px;gap:6px}
  .span2{grid-column:span 2}
  .topbar{flex-direction:column;align-items:stretch}
  .right-col{flex-direction:row;flex-wrap:wrap}
  .coll-panel{min-height:unset}
  .definition{min-height:unset}
  .example{min-height:unset}
  .vn-box{min-height:unset}
}
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="mini">APTIS FLIP CARD DOSSIER</div>
    <h1>50 Focus Words – 2 Collocations Each</h1>
    <p>Mỗi từ có 2 collocations, thiết kế lại theo phong cách mẫu, tối ưu cho điện thoại.</p>
  </div>

  <div class="panel-box toolbar">
    <input id="searchInput" class="input span2" list="wordList" placeholder="Input: Search V001, word, collocation…" />
    <datalist id="wordList"></datalist>
    <select id="cardSelect" class="select"><option value="">Select</option></select>
    <button class="btn" id="jumpBtn">Jump</button>
    <button class="btn" id="toggleVnBtn">Hide Vietnamese</button>
    <button class="btn btn-lav" id="randomTopBtn">Random</button>
  </div>

  <div class="panel-box random-wrap">
    <button class="random-main" id="randomBigBtn">Random</button>
  </div>

  <div class="card-shell" id="cardShell"></div>
</div>

ranslation": "Các trường đại học có thể khuyến khích tinh thần khởi nghiệp thông qua các dự án thực tế."}]}, {"id": 5, "word": "Digital transformation", "ipa": "/ˈdɪdʒɪtl ˌtrænsfəˈmeɪʃən/", "meaning": "Sự chuyển đổi số", "simple": "The process of changing traditional systems by using digital technology.", "collocations": [{"index": 1, "title": "COLLOCATION 1", "tag": "DOANH NGHIỆP", "phrase": "undergo digital transformation", "meaning": "trải qua chuyển đổi số", "example": "Many small businesses need to undergo digital transformation to survive.", "note": "Dùng tốt cho chủ đề kinh doanh, dịch vụ và hiện đại hoá.", "translation": "Nhiều doanh nghiệp nhỏ cần trải qua chuyển đổi số để tồn tại."}, {"index": 2, "title": "COLLOCATION 2", "tag": "CÔNG NGHỆ", "phrase": "accelerate digital transformation", "meaning": "đẩy nhanh chuyển đổi số", "example": "Governments are trying to accelerate digital transformation in public services.", "note": "Hợp với đề về chính phủ, dịch vụ công và đổi mới công nghệ.", "translation": "Các chính phủ đang cố gắng đẩy nhanh chuyển đổi số trong các dịch vụ công."}]}, {"id": 6, "word": "Superficial layer", "ipa": "/ˌsuːpəˈfɪʃəl ˈleɪə(r)/", "meaning": "Lớp bề mặt; điều chỉ thể hiện phần bên ngoài", "simple": "Something that shows only the obvious appearance but does not reveal deeper meanings or hidden aspects.", "collocations": [{"index": 1, "title": "COLLOCATION 1", "tag": "PHÂN TÍCH", "phrase": "a superficial layer of understanding", "meaning": "một lớp hiểu biết bề mặt", "example": "Looking only at test scores gives a superficial layer of understanding.", "note": "Dùng để phê bình cách nhìn đơn giản, thiếu chiều sâu.", "translation": "Chỉ nhìn vào điểm thi sẽ tạo ra một cách hiểu hời hợt."}, {"index": 2, "title": "COLLOCATION 2", "tag": "TƯ DUY", "phrase": "look beyond the superficial layer", "meaning": "nhìn vượt ra ngoài lớp bề mặt", "example": "Students should look beyond the superficial layer of a social problem.", "note": "Phù hợp tron với đề về mạng xã hội và truyền thông.", "translation": "Mạng xã hội ảnh hưởng mạnh đến nhận thức của thanh thiếu niên."}]}];
let currentIndex = 0;
let showingBack = false;
let activeMode = 0;
let hideVietnamese = false;
const savedKey = 'aptis_sv_50_collocation_saved';
let saved = new Set(JSON.parse(localStorage.getItem(savedKey) || '[]'));

const shell = document.getElementById('cardShell');
const searchInput = document.getElementById('searchInput');
const cardSelect = document.getElementById('cardSelect');
const wordList = document.getElementById('wordList');
const jumpBtn = document.getElementById('jumpBtn');
const toggleVnBtn = document.getElementById('toggleVnBtn');
document.getElementById('randomTopBtn').addEventListener('click', randomCard);
document.getElementById('randomBigBtn').addEventListener('click', randomCard);

function esc(s){return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function code(id){return `V${String(id).padStart(3,'0')}`}
function saveLabel(id){return saved.has(id) ? '★ Save' : '☆ Save'}
function fillOptions(){
  wordList.innerHTML = cards.map(c => `<option value="${code(c.id)} – ${esc(c.word)}"></option><option value="${esc(c.word)}"></option>`).join('');
  cardSelect.innerHTML = '<option value="">Select</option>' + cards.map((c,i)=>`<option value="${i}">${code(c.id)} · ${esc(c.word)}</option>`).join('');
}
function highlightWord(sentence, word){
  const safe = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return esc(sentence).replace(new RegExp(safe,'ig'), m => `<mark>${m}</mark>`);
}
function render(){
  const c = cards[currentIndex];
  const wrapClass = 'card-shell' + (hideVietnamese ? ' hidden-vn' : '');
  shell.className = wrapClass;
  if(!showingBack){
    shell.innerHTML = `
      <div class="card-inner">
        <div class="topbar">
          <div>
            <div class="pill">Front Side</div>
            <div class="top-info">Test 1 · Set 1: Core Foundations</div>
          </div>
          <div class="right-col">
            <button class="btn btn-pink" id="saveBtn">${saveLabel(c.id)}</button>
          </div>
        </div>
        <div class="divider"></div>
        <div class="label">Focus Word</div>
        <div class="word">${esc(c.word)}</div>
        <div class="ipa">${esc(c.ipa)}</div>
        <div class="definition"><span class="definition-vn">${esc(c.word)} nghĩa là ${esc((c.meaning || '').toLowerCase())}. </span>${esc(c.simple)}</div>
        <div class="recall">
          <div class="title">Try to recall</div>
          <ul>
            <li>Collocation 1</li>
            <li>Collocation 2</li>
          </ul>
          <div class="note">Nhấn Flip để xem cả 2 collocations, cách dùng và ví dụ band IELTS 6.0+.</div>
        </div>
        <div class="action-row">
          <button class="btn btn-blue" id="speakWordBtn">🔊 Word</button>
          <button class="btn btn-pink" id="flipBtn">Lật thẻ ↻</button>
        </div>
        <div class="divider"></div>
        <div class="bottom-nav">
          <div class="hint">Phím tắt: Space = flip · ← → = chuyển card</div>
          <div class="nav-buttons">
            <button class="btn" id="prevBtn">← Previous</button>
            <button class="btn btn-blue" id="nextBtn">Next →</button>
          </div>
        </div>
      </div>`;
  } else {
    const item = c.collocations[activeMode];
    shell.innerHTML = `
      <div class="card-inner">
        <div class="topbar">
          <div>
            <div class="pill">Back Side</div>
            <div class="top-info">${esc(c.word)} ${esc(c.ipa)} · ${code(c.id)}</div>
          </div>
          <div class="right-col">
            <button class="btn btn-pink" id="flipBackBtn">↺ Lật lại</button>
            <button class="btn btn-pink" id="saveBtn">${saveLabel(c.id)}</button>
          </div>
        </div>
        <div class="divider"></div>

        <div class="mode-tabs">
          <button class="btn ${activeMode===0 ? 'btn-blue' : ''} mode-btn" id="mode1Btn">Collocation 1</button>
          <button class="btn ${activeMode===1 ? 'btn-blue' : ''} mode-btn" id="mode2Btn">Collocation 2</button>
        </div>

        <div class="coll-panel">
          <div class="section-red">${item.title}</div>
          <div class="coll-tag">${esc(item.tag)}</div>
          <div class="phrase">${esc(item.phrase)}</div>
          <div class="back-ipa">${esc(c.ipa)}</div>
          <div class="meaning-line">${esc(item.meaning)}</div>
          <div class="example">${highlightWord(item.example, c.word)}</div>
          <div class="vn-box">
            <div class="label-small">Tiếng Việt</div>
            <div class="vn-text">${esc(item.translation)}</div>
          </div>
          <div class="vn-box" style="background:#f8f5ff; margin-top:0; min-height:auto;">
            <div class="label-small">IELTS 6.0+ Use</div>
            <div class="vn-text" style="font-style:normal;">${esc(item.note)}</div>
          </div>
          <div class="back-bottom action-row">
            <button class="btn btn-blue" id="speakPhraseBtn">🔊 Phrase ${item.index}</button>
            <button class="btn btn-pink" id="flipBackBtn2">↺ Lật lại</button>
            <button class="btn" id="prevBtn">← Previous</button>
            <button class="btn btn-blue" id="nextBtn">Next word →</button>
          </div>
        </div>
      </div>`;
  }
  cardSelect.value = String(currentIndex);
  bindActions();
  requestAnimationFrame(()=>{ document.getElementById('cardShell').scrollIntoView({behavior:'smooth', block:'start'}); });
}
function bindActions(){
  document.getElementById('saveBtn')?.addEventListener('click', toggleSave);
  document.getElementById('flipBtn')?.addEventListener('click', ()=>{showingBack=true;activeMode=0;render()});
  document.getElementById('flipBackBtn')?.addEventListener('click', ()=>{showingBack=false;render()});
  document.getElementById('flipBackBtn2')?.addEventListener('click', ()=>{showingBack=false;render()});
  document.getElementById('prevBtn')?.addEventListener('click', prevCard);
  document.getElementById('nextBtn')?.addEventListener('click', nextCard);
  document.getElementById('speakWordBtn')?.addEventListener('click', ()=>speak(cards[currentIndex].word));
  document.getElementById('speakPhraseBtn')?.addEventListener('click', ()=>{
    const item = cards[currentIndex].collocations[activeMode];
    speak(item.phrase + '. ' + item.example);
  });
  document.getElementById('mode1Btn')?.addEventListener('click', ()=>{activeMode=0;render()});
  document.getElementById('mode2Btn')?.addEventListener('click', ()=>{activeMode=1;render()});
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}
function toggleSave(){
  const id = cards[currentIndex].id;
  if(saved.has(id)) saved.delete(id); else saved.add(id);
  localStorage.setItem(savedKey, JSON.stringify([...saved]));
  render();
}
function prevCard(){currentIndex=(currentIndex-1+cards.length)%cards.length;showingBack=false;activeMode=0;render()}
function nextCard(){currentIndex=(currentIndex+1)%cards.length;showingBack=false;activeMode=0;render()}
function randomCard(){
  let n=currentIndex;
  while(cards.length>1 && n===currentIndex) n=Math.floor(Math.random()*cards.length);
  currentIndex=n;showingBack=false;activeMode=0;render();
}
function jumpToCard(){
  const q = searchInput.value.trim().toLowerCase();
  if(!q && cardSelect.value!==''){currentIndex=Number(cardSelect.value);showingBack=false;activeMode=0;render();return;}
  if(!q) return;
  const numMatch = q.match(/v?(\d{1,3})/i);
  if(numMatch){
    const idx = cards.findIndex(c => c.id===Number(numMatch[1]));
    if(idx>=0){currentIndex=idx;showingBack=false;activeMode=0;render();return;}
  }
  const idx = cards.findIndex(c => c.word.toLowerCase().includes(q) || c.collocations.some(x => x.phrase.toLowerCase().includes(q)) || c.meaning.toLowerCase().includes(q));
  if(idx>=0){currentIndex=idx;showingBack=false;activeMode=0;render();}
}
function toggleVietnamese(){
  hideVietnamese=!hideVietnamese;
  toggleVnBtn.textContent = hideVietnamese ? 'Show Vietnamese' : 'Hide Vietnamese';
  render();
}

document.addEventListener('keydown', (e)=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(e.code==='Space'){e.preventDefault(); showingBack=!showingBack; if(showingBack && activeMode===null) activeMode=0; render();}
  if(e.key==='ArrowLeft') prevCard();
  if(e.key==='ArrowRight') nextCard();
});

jumpBtn.addEventListener('click', jumpToCard);
searchInput.addEventListener('keydown', e=>{if(e.key==='Enter') jumpToCard()});
cardSelect.addEventListener('change', ()=>{if(cardSelect.value!==''){currentIndex=Number(cardSelect.value);showingBack=false;activeMode=0;render();}});
toggleVnBtn.addEventListener('click', toggleVietnamese);
fillOptions();
render();
</script>
</body>
</html>
